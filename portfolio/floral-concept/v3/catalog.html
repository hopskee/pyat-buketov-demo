<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Каталог — Тихий сад</title>
  <meta name="description" content="Демонстрационный каталог ателье «Тихий сад». Поиск и корзина без отправки заказа.">
  <meta name="theme-color" content="#E4ECE3">
  <link rel="icon" href="assets/mark.svg">
  <link rel="stylesheet" href="css/atelier.css">
</head>
<body class="atelier">
  <a class="skip" href="#main">К содержанию</a>
  <header class="top">
    <a class="chip mark" href="index.html">
      <svg width="22" height="26" viewBox="0 0 28 32" aria-hidden="true"><path d="M14 30 V10" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M14 16c0 0-8-1.5-8-6 4 .2 8 3.2 8 6Z" fill="currentColor"/><path d="M14 20c0 0 8-2 8-7-4 .2-8 3.6-8 7Z" fill="currentColor"/></svg>
      тихий сад
    </a>
    <div class="top-end">
      <a class="textlink" href="catalog.html" aria-current="page">Каталог</a>
      <a class="textlink wide" href="index.html#order">Заказ</a>
      <button class="chip bag" type="button" data-open-cart data-cart-label aria-label="Корзина, пока пусто">Корзина <b data-cart-count>0</b></button>
    </div>
  </header>
  <main id="main" class="wrap">
    <div class="page-head">
      <nav class="crumbs" aria-label="Навигация"><a href="index.html">Главная</a><span aria-hidden="true">/</span><span>Каталог</span></nav>
      <h1>Каталог</h1>
      <p class="lead">Девять демонстрационных сборов. Ищите по цветку. Ни один букет отсюда не уезжает.</p>
    </div>
    <div class="tools">
      <form class="finder" id="finder" role="search">
        <label for="q"><span>Найти</span>
          <input id="q" name="q" type="search" autocomplete="off" placeholder="пион, роза, ветвь">
        </label>
      </form>
      <div class="tool-row">
        <div class="kinds" role="group" aria-label="Тип">
          <button type="button" data-kind="all" aria-pressed="true">Все</button>
          <button type="button" data-kind="bouquet" aria-pressed="false">Букеты</button>
          <button type="button" data-kind="composition" aria-pressed="false">Композиции</button>
          <button type="button" data-kind="mono" aria-pressed="false">Моно</button>
        </div>
        <label class="sort"><span>Порядок</span>
          <select data-sort>
            <option value="atelier">Как в ателье</option>
            <option value="price-asc">Сначала ниже</option>
            <option value="price-desc">Сначала выше</option>
          </select>
        </label>
      </div>
    </div>
    <section class="catalog">
      <p class="count" data-count></p>
      <div class="catalog-grid" data-catalog></div>
      <div class="empty" data-grid-empty hidden>
        <p>В этом запросе пусто.</p>
        <button class="btn" type="button" data-reset>Сбросить</button>
      </div>
    </section>
  </main>
  <footer class="footer">
    <div class="wrap footer-grid">
      <p class="mark">тихий сад</p>
      <nav aria-label="Разделы в подвале"><a href="index.html">Главная</a><a href="catalog.html">Каталог</a></nav>
      <p>Цены демонстрационные. В браузере хранятся только номера сборов и количество.</p>
    </div>
  </footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="js/data.js"></script>
  <script src="js/atelier.js"></script>
</body>
</html>
